version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: artisan237-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: artisan237
      POSTGRES_PASSWORD: ${DB_PASSWORD:-artisan237}
      POSTGRES_DB: artisan237
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisan237"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: artisan237-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # NestJS API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    container_name: artisan237-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://artisan237:${DB_PASSWORD:-artisan237}@db:5432/artisan237?schema=public"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-production
    container_name: artisan237-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  # FastAPI ML Service
  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: artisan237-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://artisan237:${DB_PASSWORD:-artisan237}@db:5432/artisan237?schema=public"

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: artisan237-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  redis_data:
  minio_data:
  ml_models: