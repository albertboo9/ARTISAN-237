# Render Blueprint — ARTISAN-237 Backend
# Déployez en un clic : connectez ce repo à Render et il créera
# automatiquement le service web + la base de données PostgreSQL.

databases:
  - name: artisan237-db
    plan: free
    databaseName: artisan237
    user: artisan237_user
    region: frankfurt # Proche de l'Afrique de l'Ouest

services:
  - type: web
    name: artisan237-api
    plan: free
    runtime: node
    region: frankfurt
    buildCommand: chmod +x apps/api/render-build.sh && ./apps/api/render-build.sh
    startCommand: |
      cd apps/api && npx prisma db push --accept-data-loss && node dist/src/main.js
    healthCheckPath: /api/v1/test/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: https://artisan237.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: artisan237-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: JWT_REFRESH_TOKEN_EXPIRY
        value: 7d
      # Les variables suivantes doivent être ajoutées manuellement dans le dashboard Render
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_API_URL
        value: https://verification.didit.me/v3
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: http://localhost:8000
