{
  "name": "artisan237-ml-service",
  "version": "1.0.0",
  "description": "Artisan237 ML Recommendation Service",
  "main": "app/main.py",
  "scripts": {
    "start": "uvicorn app.main:app --host 0.0.0.0 --port 8000",
    "dev": "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
    "train": "python app/train.py",
    "test": "python -m pytest tests/ -v",
    "lint": "ruff check app/",
    "format": "ruff check --fix app/"
  },
  "dependencies": {
    "fastapi": "^0.111.0",
    "uvicorn": "^0.30.0",
    "scikit-learn": "^1.5.0",
    "pydantic": "^2.7.0",
    "pydantic-settings": "^2.3.0",
    "joblib": "^1.4.0",
    "numpy": "^2.1.0",
    "pandas": "^2.2.0",
    "httpx": "^0.27.0",
    "python-multipart": "^0.0.9",
    "prometheus-client": "^0.21.0"
  },
  "devDependencies": {
    "pytest": "^8.0.0",
    "pytest-asyncio": "^0.23.0",
    "httpx": "^0.27.0",
    "ruff": "^0.5.0"
  },
  "python": "3.12"
}