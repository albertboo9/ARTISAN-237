<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintenance - Artisan237</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; color: #166534; margin-bottom: 0.5rem; }
    p { color: #15803d; font-size: 1.1rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #bbf7d0;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🔧</div>
    <h1>Artisan237</h1>
    <p>Nous préparons quelque chose de spécial...</p>
    <p>La plateforme sera bientôt de retour.</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
